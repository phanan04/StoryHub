services:
  - type: web
    name: storyhub-backend
    runtime: node
    buildCommand: cd backend && npm install && npx tsc
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
    autoDeploy: true
